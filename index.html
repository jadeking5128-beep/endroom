<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0b">
<meta name="description" content="ENDROOM — browser-based Linux workspace">
<title>ENDROOM</title>
<style>
:root{color-scheme:dark;--bg:#08090a;--panel:#101214;--line:#282d30;--muted:#7d858a;--text:#e8ecee;--gold:#c8a96b;--green:#9bc6a8;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}button,input{font:inherit}button{cursor:pointer}.shell{height:100dvh;display:flex;flex-direction:column}.bar{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#0c0e0f;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.mark{width:27px;height:27px;border:1px solid #8e754a;border-radius:7px;display:grid;place-items:center;color:var(--gold);font:600 11px var(--mono)}.wordmark{font-size:12px;font-weight:750;letter-spacing:.2em}.right{display:flex;align-items:center;gap:13px}.connection{display:flex;align-items:center;gap:7px;color:#aab5ad;font:10px var(--mono)}.dot{width:6px;height:6px;border-radius:50%;background:#66716a}.dot.on{background:var(--green);box-shadow:0 0 9px #9bc6a866}.btn{border:1px solid var(--line);border-radius:6px;background:#15191b;color:#c8ced1;padding:7px 10px;font-size:10px}.btn:hover{border-color:#7e6a47;color:#f0dfbd}.terminal{flex:1;min-height:0;display:flex;flex-direction:column;background:#090b0c}.termhead{height:37px;flex:0 0 37px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #202528;background:#0d1011}.termname{display:flex;align-items:center;gap:9px;color:#bdc5c8;font:10px var(--mono)}.termname .dot{background:var(--green)}.term-actions{display:flex;gap:7px}.tiny{border:0;background:transparent;color:#798388;padding:5px 7px;font-size:10px}.tiny:hover{color:var(--gold)}.output{flex:1;min-height:0;overflow:auto;padding:18px 20px 12px;color:#cbd1d3;font:12px/1.8 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}.rowline{min-height:1.8em}.dim{color:#748087}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:#d28f84}.inputbar{display:flex;align-items:center;gap:10px;min-height:53px;padding:9px 17px;border-top:1px solid #252a2d;background:#0e1112}.prompt{font:12px var(--mono);color:var(--green);white-space:nowrap}.cmd{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#edf1f2;font:12px var(--mono);caret-color:var(--gold)}.cmd::placeholder{color:#505b61}.run{border:1px solid #a68a58;background:var(--gold);color:#111;padding:7px 13px;border-radius:5px;font-size:10px;font-weight:750}.login{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#171512 0%,#0a0b0c 50%,#08090a 100%);padding:22px}.login-card{width:min(100%,360px);border:1px solid #30302b;border-radius:12px;background:#0d0f10;padding:27px;box-shadow:0 30px 100px #0009}.login-brand{display:flex;align-items:center;gap:11px;margin-bottom:27px}.login-card h1{font-size:21px;font-weight:600;letter-spacing:-.04em;margin:0 0 7px}.sub{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 23px}.field{display:grid;gap:7px;margin:13px 0}.field label{font:9px var(--mono);color:#9ba2a5;letter-spacing:.1em;text-transform:uppercase}.field input{height:42px;width:100%;border:1px solid #303639;border-radius:6px;background:#090b0c;color:#edf1f2;padding:0 11px;outline:0;font-size:12px}.field input:focus{border-color:#a68a58}.login-submit{width:100%;height:41px;margin-top:9px;border:1px solid #a68a58;border-radius:6px;background:var(--gold);color:#111;font-size:11px;font-weight:750}.error{min-height:17px;color:#d28f84;font-size:10px;margin-top:10px;line-height:1.5}.login-foot{margin-top:18px;padding-top:14px;border-top:1px solid #252a2d;color:#687278;font:9px/1.6 var(--mono)}.hidden{display:none!important}
@media(max-width:600px){.bar{height:49px;flex-basis:49px;padding:0 12px}.connection{font-size:9px}.btn{padding:6px 8px}.output{padding:13px 12px;font-size:11px}.inputbar{padding:9px 10px;gap:7px}.prompt,.cmd{font-size:11px}.run{padding:7px 10px}}
</style>
</head>
<body>
<div class="shell" id="app">
<header class="bar"><div class="brand"><div class="mark">ER</div><div class="wordmark">ENDROOM</div></div><div class="right"><div class="connection"><i class="dot" id="statusDot"></i><span id="statusText">DISCONNECTED</span></div><button class="btn" id="logout" type="button">SIGN OUT</button></div></header>
<main class="terminal">
<div class="termhead"><div class="termname"><i class="dot" id="termDot"></i><span id="termTitle">workspace</span><span class="dim">/</span><span class="dim">linux</span></div><div class="term-actions"><button class="tiny" id="copy" type="button">COPY</button><button class="tiny" id="clear" type="button">CLEAR</button></div></div>
<div class="output" id="output" role="log" aria-live="polite"></div>
<form class="inputbar" id="commandForm"><span class="prompt" id="prompt">user@endroom:~$</span><input class="cmd" id="command" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Linux command" placeholder="Enter command…" disabled><button class="run" id="run" type="submit" disabled>RUN</button></form>
</main></div>
<section class="login" id="login"><form class="login-card" id="loginForm"><div class="login-brand"><div class="mark">ER</div><div class="wordmark">ENDROOM</div></div><h1>Sign in to your workspace</h1><p class="sub">Authenticated access to your isolated Linux environment.</p><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="64"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"></div><button class="login-submit" id="loginSubmit" type="submit">SIGN IN</button><div class="error" id="loginError" role="alert"></div><div class="login-foot">PRIVATE WORKSPACE · ENCRYPTED SESSION COOKIE<br>Access is available only after server configuration.</div></form></section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),output=$('output'),input=$('command'),form=$('commandForm'),login=$('login'),loginError=$('loginError');
let history=[],historyIndex=0,busy=false,username='user',cwd='~';
function add(text,cls=''){const el=document.createElement('div');el.className='rowline '+cls;el.textContent=text;output.appendChild(el);output.scrollTop=output.scrollHeight}
function status(online,label){$('statusDot').classList.toggle('on',online);$('termDot').classList.toggle('on',online);$('statusText').textContent=label}
function prompt(){ $('prompt').textContent=username+'@endroom:'+cwd+'$'}
function setReady(name,dir){username=name||'user';cwd=dir||'~';prompt();input.disabled=false;$('run').disabled=false;login.classList.add('hidden');status(true,'CONNECTED');if(!output.childElementCount){add('ENDROOM Linux workspace','gold');add('Secure session established. Type help to view supported commands.','dim');add('','')};input.focus()}
function showLogin(){login.classList.remove('hidden');input.disabled=true;$('run').disabled=true;status(false,'DISCONNECTED')}
async function request(url,body){const res=await fetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||'Request failed');return data}
async function check(){try{const data=await request('/api/auth/me');if(data.authenticated)setReady(data.username,data.cwd);else showLogin()}catch{showLogin()}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginSubmit').disabled=true;loginError.textContent='';try{const data=await request('/api/auth/login',{username:$('username').value,password:$('password').value});$('password').value='';setReady(data.username,data.cwd)}catch(err){loginError.textContent=err.message;$('password').value=''}finally{$('loginSubmit').disabled=false}});
$('logout').addEventListener('click',async()=>{try{await request('/api/auth/logout',{})}catch{}output.replaceChildren();showLogin();$('username').focus()});
function localHelp(){add('Supported commands:','gold');add('  pwd                 Show current directory');add('  ls [-la] [path]     List workspace files');add('  cd [directory]      Change workspace directory');add('  mkdir [directory]   Create a directory');add('  touch [file]        Create an empty file');add('  cat [file]          Read a text file');add('  rm [file]           Remove one file');add('  echo TEXT           Print text');add('  date, whoami, uname Show runtime information');add('  python3 --version   Show Python version');add('  node --version      Show Node.js version');add('  git --version       Show Git version');add('  clear               Clear terminal output');add('Commands are restricted to a private workspace.','dim')}
form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const raw=input.value.trim();if(!raw)return;input.value='';history.push(raw);historyIndex=history.length;add(username+'@endroom:'+cwd+'$ '+raw,'green');if(raw==='clear'){output.replaceChildren();return}if(raw==='help'){localHelp();return}busy=true;input.disabled=true;$('run').disabled=true;try{const data=await request('/api/terminal',{command:raw});if(data.cwd){cwd=data.cwd;prompt()}if(data.stdout)add(data.stdout);if(data.stderr)add(data.stderr,'red');if(data.exitCode!==0)add('[exit '+data.exitCode+']','dim')}catch(err){add(err.message,'red')}finally{busy=false;input.disabled=false;$('run').disabled=false;input.focus()}});
input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();historyIndex=Math.max(0,historyIndex-1);input.value=history[historyIndex]||''}if(e.key==='ArrowDown'){e.preventDefault();historyIndex=Math.min(history.length,historyIndex+1);input.value=history[historyIndex]||''}});
$('clear').addEventListener('click',()=>output.replaceChildren());$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(output.innerText);add('Output copied.','dim')}catch{add('Clipboard access unavailable.','red')}});
check();
})();
</script>
</body>
</html>
